name: Production Cron Trigger
on:
  schedule:
    - cron: '0 13 * * *'  # Automatic daily run
  workflow_dispatch:      # Manual "Run" button in GitHub Actions tab

jobs:
  ping-mila:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Morning Brief
        run: |
          curl -f -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_BASE_URL }}/api/cron/morning-brief"
